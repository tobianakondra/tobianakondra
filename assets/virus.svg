  </pattern>
  <rect width="800" height="400" fill="url(#grid)" />

  <!-- Terminal Bezel Frame -->
  <rect x="10" y="10" width="780" height="380" fill="none" stroke="#1d2030" stroke-width="1.5" rx="4" />
