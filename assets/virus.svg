  <path d="M 10 300 L 790 300" stroke="#1d2030" stroke-width="1.5" />
  
  <!-- Corner Tech Accents -->
  <path d="M 10 40 L 10 10 L 40 10" fill="none" stroke="#ff0055" stroke-width="2" />
