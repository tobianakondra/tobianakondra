name: VastoWorm Autonomous Cycle

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *' # Run every 30 minutes
  workflow_dispatch: # Allow manual trigger anytime

concurrency:
  group: vastoworm-execution
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Get all history for commit analysis

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python and Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install Pillow CairoSVG

      - name: Run Cycle Engine
        run: node src/index.js --before="${{ github.event.before }}" --after="${{ github.event.after }}" --event="${{ github.event_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_TOKEN: ${{ secrets.USER_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Generate Rotating Globe
        run: python src/globe.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/landmask.png data/landmask.md assets/virus.svg assets/dashboard.gif README.md
          if ! git diff --cached --quiet; then
            git commit -m "🧬 [VastoWorm] cycle auto-update [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi
